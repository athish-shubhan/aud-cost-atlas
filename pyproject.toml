[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aud-cost-atlas"
version = "0.1.0"
description = "When is it cheapest and most expensive to trade AUDUSD and AUDJPY?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athish Shubhan" }]
dependencies = ["skeptic>=0.1", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11",
                "scikit-learn>=1.4", "xgboost>=2.0", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.8", "pandas-stubs"]

[project.scripts]
atlas-advisor = "atlas.advisor:main"
atlas-download = "atlas.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "skeptic"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["studies/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
